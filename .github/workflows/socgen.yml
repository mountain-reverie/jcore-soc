name: socgen
on:
  push:
    paths: ['tools/socgen/**', '.github/workflows/socgen.yml']
  pull_request:
    paths: ['tools/socgen/**', '.github/workflows/socgen.yml']
  workflow_dispatch:
jobs:
  vhdl-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out corpus submodules
        # The round-trip corpus reads VHDL from two submodules
        # (components/cpu, components/gps_if2). Init just those rather than
        # submodules: recursive, so we fetch only what the test needs.
        run: git submodule update --init components/cpu components/gps_if2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install ghdl (for round-trip re-analysis)
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Build + vet
        run: |
          cd tools/socgen
          go build ./...
          go vet ./...
      - name: Test (tight timeout)
        # GitHub runners are isolated, so a -timeout is the needed guard here; a
        # runaway just fails the job rather than the dev's machine.
        #
        # -p 1 is REQUIRED: the board and elaborate integration tests each shell out
        # to `make mimas_v2` into the same output/mimas_v2 dir. Run in parallel (the
        # default), they race on Makefile.tmp ("mv: cannot stat ... Makefile.tmp").
        # Serializing test binaries with -p 1 matches the local Makefile test target.
        #
        # Budget: measured locally (JCORE_SOC_ROOT set, `go test ./... -count=1 -p 1`)
        # at ~75s wall on this branch (emit 41.8s, generate 17.7s, elaborate 7.6s,
        # remaining packages ~8s combined; ghdl-bound, not CPU-bound), after also
        # adding the 4 split cpu_config_*.vhd corpus entries (negligible, corpus
        # package is ~1s total). CI runners were observed to be 2-3x slower than
        # this machine on this ghdl-bound work, so 150-225s was the realistic range
        # -- the old 150s outer / 90s inner budget had ~0 headroom and was already
        # marginal before this branch. Raised to give real slack above the 2-3x
        # estimate rather than chase single-digit-second regressions.
        env:
          JCORE_SOC_ROOT: ${{ github.workspace }}
        run: |
          cd tools/socgen
          timeout -s KILL 300 go test ./... -timeout 270s -count=1 -p 1
